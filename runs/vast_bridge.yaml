# SkyPilot launch for the MemoryBridge experiment (latent memory prefix).
# Backbone frozen Qwen3.5-4B; only the bridge trains. Checkpoints local.
#
# Design: docs/cellmem-v4/2026-05-25-memory-bridge-experiment.md
#
# Usage:
#   sky launch --infra vast --gpus L40S:1 -c cellmem-bridge runs/vast_bridge.yaml
#   sky logs cellmem-bridge
#   # DO NOT auto-down: leave the cluster up for inspection.

resources:
  use_spot: true
  gpus: L40S:1

envs:
  MODEL: "Qwen/Qwen3.5-4B"
  K_GIST: "16"
  STEPS: "400"
  LR: "1e-4"
  EVAL_N: "20"

setup: |
  git clone https://github.com/youest/nanochat.git ~/nanochat 2>/dev/null || \
    (cd ~/nanochat && git remote set-url origin https://github.com/youest/nanochat.git && \
     git fetch origin && git checkout cellmem/v2 && git pull origin cellmem/v2)
  cd ~/nanochat && git remote set-url origin https://github.com/youest/nanochat.git && \
    git fetch origin && git checkout cellmem/v2 && git pull origin cellmem/v2

  command -v uv &>/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env 2>/dev/null || true
  cd ~/nanochat
  [ -d ".venv" ] || uv venv
  uv sync --extra gpu

  source .venv/bin/activate

  # Qwen3.5 is post-cutoff: needs a recent transformers (hybrid Gated-DeltaNet).
  # torch-fallback DeltaNet works without flash-linear-attention/causal-conv1d.
  uv pip install -U transformers accelerate

  # The transformers upgrade can pull a torch built for a CUDA newer than the
  # box driver (we hit "driver too old, found 12090" = CUDA 12.9 driver vs a
  # cu13x torch). Re-pin torch to cu126 LAST so it matches the driver
  # (memory: cu126 fix). Then verify a REAL cuda op, not just is_available().
  uv pip install --reinstall torch==2.9.1 --index-url https://download.pytorch.org/whl/cu126
  python -c "import torch; x=torch.zeros(1).cuda(); print('CUDA op OK; torch', torch.__version__, 'cuda', torch.version.cuda)"

  # Pre-download model (trust_remote_code in case modeling code ships on the Hub).
  python -c "from transformers import AutoModelForCausalLM, AutoTokenizer; import torch; AutoTokenizer.from_pretrained('$MODEL', trust_remote_code=True); AutoModelForCausalLM.from_pretrained('$MODEL', dtype=torch.bfloat16, trust_remote_code=True); print('Model ready.')"

run: |
  set -e
  set -o pipefail   # so `python ... | tee` failures propagate (smoke gates training)
  cd ~/nanochat
  source .venv/bin/activate
  export OMP_NUM_THREADS=1
  export PYTHONPATH=~/nanochat

  python -c "import torch; assert torch.cuda.is_available(), 'CUDA not available!'; print(f'CUDA OK: {torch.cuda.get_device_name(0)}')"
  mkdir -p /tmp/bridge_ckpt

  echo "=== STEP 1/2: smoke (load verification — gates the training run) ==="
  python scripts/train_cellmem_bridge.py --smoke --model "$MODEL" \
    --device cuda --trust-remote-code 2>&1 | tee /tmp/bridge_smoke.log

  echo "=== STEP 2/2: train bridge + head-to-head eval ==="
  echo "Model: $MODEL | K_GIST=$K_GIST | STEPS=$STEPS | LR=$LR"
  python scripts/train_cellmem_bridge.py \
    --model "$MODEL" \
    --device cuda \
    --k-gist "$K_GIST" \
    --steps "$STEPS" \
    --lr "$LR" \
    --eval-n "$EVAL_N" \
    --trust-remote-code \
    --out /tmp/bridge_ckpt \
    2>&1 | tee /tmp/bridge_train.log

  echo "========================================"
  echo "DONE. Bridge + logs at /tmp/bridge_ckpt, /tmp/bridge_train.log"
  echo "Retrieve: sky rsync cellmem-bridge:/tmp/bridge_ckpt/ ./bridge_ckpt/"
  echo "========================================"
