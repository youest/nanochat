# SkyPilot: CellMem v2 eval on A10G spot with d24 SFT from S3.
#
# Usage:
#   sky launch runs/spot_eval_cellmem.yaml -c cellmem-eval
#   sky logs cellmem-eval
#   sky down cellmem-eval

resources:
  any_of:
    - accelerators: A10G:1
      region: eu-west-2
    - accelerators: A10G:1
      region: us-east-1
    - accelerators: A10G:1
      region: us-west-2
    - accelerators: A10G:1
      region: eu-west-1
    - accelerators: T4:1
      region: us-east-1
    - accelerators: T4:1
      region: eu-west-2

file_mounts:
  /checkpoints:
    source: s3://nanoy-checks-youest/
    mode: MOUNT

setup: |
  git clone https://github.com/youest/nanochat.git ~/nanochat 2>/dev/null || \
    (cd ~/nanochat && git fetch && git checkout cellmem/v2 && git pull)
  cd ~/nanochat && git checkout cellmem/v2

  command -v uv &>/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env 2>/dev/null || true
  cd ~/nanochat
  [ -d ".venv" ] || uv venv
  uv sync --extra gpu

  # Fix torch CUDA if needed
  source .venv/bin/activate
  python -c "import torch; assert torch.cuda.is_available()" 2>/dev/null || {
    echo "CUDA not available, reinstalling torch for cu126..."
    uv pip install --reinstall torch==2.9.1 --index-url https://download.pytorch.org/whl/cu126
  }

  # Copy d24 SFT checkpoint from S3 mount to local disk
  mkdir -p ~/.cache/nanochat/base_checkpoints/d24
  LATEST=$(ls /checkpoints/nanochat/base_checkpoints/d24/meta_*.json 2>/dev/null | sort | tail -1 | sed 's/.*meta_\([0-9]*\)\.json/\1/')
  echo "Latest d24 checkpoint step: $LATEST"
  cp /checkpoints/nanochat/base_checkpoints/d24/model_${LATEST}.pt ~/.cache/nanochat/base_checkpoints/d24/
  cp /checkpoints/nanochat/base_checkpoints/d24/meta_${LATEST}.json ~/.cache/nanochat/base_checkpoints/d24/

  # Copy tokenizer
  mkdir -p ~/.cache/nanochat/tokenizer
  cp /checkpoints/nanochat/tokenizer/* ~/.cache/nanochat/tokenizer/

run: |
  cd ~/nanochat
  source .venv/bin/activate

  # Upgrade transformers for Qwen3 support
  export PATH=$HOME/.local/bin:$PATH
  uv pip install "transformers @ git+https://github.com/huggingface/transformers.git" accelerate 2>&1 | tail -3

  echo "=== CellMem Qwen3-4B Training + Serve ==="
  PYTHONUNBUFFERED=1 python -m scripts.train_cellmem_qwen \
    --model Qwen/Qwen3-4B \
    --epochs 20 \
    --lr 1e-3 \
    --layers mid \
    --save-path ~/cellmem_lora.pt \
    --serve \
    --port 8001
