<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NanoChat</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        html, body{
            height: 100%;
            margin: 0;
        }

        body {
            font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #ffffff;
            color: #111827;
            min-height: 100dvh;
            margin: 0;
            display: flex;
            flex-direction: row;
        }

        .main-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .memory-panel {
            width: 340px;
            background: #0f1117;
            border-left: 1px solid #1e2130;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .memory-panel.active {
            display: flex;
        }

        .memory-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #1e2130;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .memory-header h3 {
            font-size: 0.8rem;
            font-weight: 600;
            margin: 0;
            color: #e0e0e0;
            letter-spacing: 0.05em;
        }

        .memory-header .reset-btn {
            font-size: 0.65rem;
            padding: 2px 8px;
            border: 1px solid #2a2d3a;
            border-radius: 4px;
            background: #1a1d2e;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.2s;
        }

        .memory-header .reset-btn:hover {
            background: #2a2d3a;
            color: #e0e0e0;
        }

        .memory-stats {
            font-size: 0.7rem;
            color: #6b7280;
            padding: 0.4rem 1rem;
            border-bottom: 1px solid #1e2130;
        }

        .memory-graph-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .memory-graph-container svg {
            width: 100%;
            height: 100%;
        }

        .memory-detail {
            padding: 0.6rem 1rem;
            border-top: 1px solid #1e2130;
            background: #13151f;
            font-size: 0.7rem;
            color: #9ca3af;
            min-height: 60px;
            max-height: 100px;
            overflow-y: auto;
        }

        .memory-detail .detail-title {
            color: #e0e0e0;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .memory-detail .detail-tokens {
            color: #60a5fa;
            word-break: break-all;
        }

        .header {
            background-color: #ffffff;
            padding: 1.25rem 1.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-logo {
            height: 32px;
            width: auto;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            color: #111827;
        }

        .new-conversation-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            background-color: #ffffff;
            color: #6b7280;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .new-conversation-btn:hover {
            background-color: #f3f4f6;
            border-color: #d1d5db;
            color: #374151;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .chat-wrapper {
            max-width: 48rem;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .message {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 0.5rem;
            color: #0d0d0d;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            white-space: pre-wrap;
            line-height: 1.6;
            max-width: 100%;
        }

        .message.assistant .message-content {
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 0.5rem;
            padding: 0.5rem;
            margin-left: -0.5rem;
            transition: background-color 0.2s ease;
        }

        .message.assistant .message-content:hover {
            background-color: #f9fafb;
        }

        .message.user .message-content {
            background-color: #f3f4f6;
            border-radius: 1.25rem;
            padding: 0.8rem 1rem;
            max-width: 65%;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .message.user .message-content:hover {
            background-color: #e5e7eb;
        }

        .message.console .message-content {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'Courier New', monospace;
            font-size: 0.875rem;
            background-color: #fafafa;
            padding: 0.75rem 1rem;
            color: #374151;
            max-width: 80%;
        }

        .input-container {
            background-color: #ffffff;
            padding: 1rem;
            padding-bottom: calc(1rem + env(safe-area-inset-bottom))
        }

        .input-wrapper {
            max-width: 48rem;
            margin: 0 auto;
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.75rem;
            background-color: #ffffff;
            color: #111827;
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            min-height: 54px;
            max-height: 200px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .chat-input::placeholder {
            color: #9ca3af;
        }

        .chat-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .send-button {
            flex-shrink: 0;
            padding: 0;
            width: 54px;
            height: 54px;
            border: 1px solid #111827;
            border-radius: 0.75rem;
            background-color: #111827;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .send-button:hover:not(:disabled) {
            background-color: #2563eb;
            border-color: #2563eb;
        }

        .send-button:disabled {
            cursor: not-allowed;
            border-color: #d1d5db;
            background-color: #e5e7eb;
            color: #9ca3af;
        }

        .typing-indicator {
            display: inline-block;
            color: #6b7280;
            letter-spacing: 0.15em;
        }

        .typing-indicator::after {
            content: '···';
            animation: typing 1.4s infinite;
        }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.2; }
            30% { opacity: 1; }
        }

        .error-message {
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="main-column">
    <div class="header">
        <div class="header-left">
            <button class="new-conversation-btn" onclick="newConversation()" title="New Conversation (Ctrl+Shift+N)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                </svg>
            </button>
            <h1>nanochat</h1>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="chat-wrapper" id="chatWrapper">
            <!-- Messages will be added here -->
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <textarea
                id="chatInput"
                class="chat-input"
                placeholder="Ask anything"
                rows="1"
                onkeydown="handleKeyDown(event)"
            ></textarea>
            <button id="sendButton" class="send-button" onclick="sendMessage()" disabled>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13"></path>
                    <path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
                </svg>
            </button>
        </div>
    </div>
    </div>

    <div class="memory-panel" id="memoryPanel">
        <div class="memory-header">
            <h3>CELLMEM v2</h3>
            <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:#8b8fa3;cursor:pointer" title="Toggle memory usage">
                <input type="checkbox" id="memoryToggle" checked onchange="window._memoryEnabled=this.checked"> ON
            </label>
            <button class="reset-btn" onclick="resetMemory()" title="Clear all memories">Reset</button>
        </div>
        <div class="memory-stats" id="memoryStats">Loading...</div>
        <div class="memory-graph-container" id="memoryGraphContainer"></div>
        <div class="memory-detail" id="memoryDetail">
            <div class="detail-title">Hover a node to inspect</div>
        </div>
    </div>

    <script>
        const API_URL = '';
        const chatContainer = document.getElementById('chatContainer');
        const chatWrapper = document.getElementById('chatWrapper');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');

        let messages = [];
        let isGenerating = false;
        let currentTemperature = 0.8;
        let currentTopK = 50;

        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            sendButton.disabled = !this.value.trim() || isGenerating;
        });

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        document.addEventListener('keydown', function(event) {
            // Ctrl+Shift+N for new conversation
            if (event.ctrlKey && event.shiftKey && event.key === 'N') {
                event.preventDefault();
                if (!isGenerating) {
                    newConversation();
                }
            }
        });

        function newConversation() {
            messages = [];
            chatWrapper.innerHTML = '';
            chatInput.value = '';
            chatInput.style.height = 'auto';
            sendButton.disabled = false;
            isGenerating = false;
            chatInput.focus();
        }

        function addMessage(role, content, messageIndex = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            // Add click handler for user messages to enable editing
            if (role === 'user' && messageIndex !== null) {
                contentDiv.setAttribute('data-message-index', messageIndex);
                contentDiv.setAttribute('title', 'Click to edit and restart from here');
                contentDiv.addEventListener('click', function() {
                    if (!isGenerating) {
                        editMessage(messageIndex);
                    }
                });
            }

            // Add click handler for assistant messages to enable regeneration
            if (role === 'assistant' && messageIndex !== null) {
                contentDiv.setAttribute('data-message-index', messageIndex);
                contentDiv.setAttribute('title', 'Click to regenerate this response');
                contentDiv.addEventListener('click', function() {
                    if (!isGenerating) {
                        regenerateMessage(messageIndex);
                    }
                });
            }

            messageDiv.appendChild(contentDiv);
            chatWrapper.appendChild(messageDiv);

            chatContainer.scrollTop = chatContainer.scrollHeight;
            return contentDiv;
        }

        function editMessage(messageIndex) {
            // Find the message in the messages array
            if (messageIndex < 0 || messageIndex >= messages.length) return;

            const messageToEdit = messages[messageIndex];
            if (messageToEdit.role !== 'user') return;

            // Copy message content to input
            chatInput.value = messageToEdit.content;
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 200) + 'px';

            // Remove this message and all subsequent messages from the array
            messages = messages.slice(0, messageIndex);

            // Remove message elements from DOM starting from messageIndex
            const allMessages = chatWrapper.querySelectorAll('.message');
            for (let i = messageIndex; i < allMessages.length; i++) {
                allMessages[i].remove();
            }

            // Enable send button and focus input
            sendButton.disabled = false;
            chatInput.focus();
        }

        async function generateAssistantResponse() {
            isGenerating = true;
            sendButton.disabled = true;

            const assistantContent = addMessage('assistant', '');
            assistantContent.innerHTML = '<span class="typing-indicator"></span>';

            try {
                const response = await fetch(`${API_URL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: messages,
                        temperature: currentTemperature,
                        top_k: currentTopK,
                        max_tokens: 512,
                        use_memory: window._memoryEnabled !== false
                    }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';
                assistantContent.textContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.token) {
                                    fullResponse += data.token;
                                    assistantContent.textContent = fullResponse;
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                            } catch (e) {
                            }
                        }
                    }
                }

                const assistantMessageIndex = messages.length;
                messages.push({ role: 'assistant', content: fullResponse });

                // Add click handler to regenerate this assistant message
                assistantContent.setAttribute('data-message-index', assistantMessageIndex);
                assistantContent.setAttribute('title', 'Click to regenerate this response');
                assistantContent.addEventListener('click', function() {
                    if (!isGenerating) {
                        regenerateMessage(assistantMessageIndex);
                    }
                });

            } catch (error) {
                console.error('Error:', error);
                assistantContent.innerHTML = `<div class="error-message">Error: ${error.message}</div>`;
            } finally {
                isGenerating = false;
                sendButton.disabled = !chatInput.value.trim();
            }
        }

        async function regenerateMessage(messageIndex) {
            // Find the message in the messages array
            if (messageIndex < 0 || messageIndex >= messages.length) return;

            const messageToRegenerate = messages[messageIndex];
            if (messageToRegenerate.role !== 'assistant') return;

            // Remove this message and all subsequent messages from the array
            messages = messages.slice(0, messageIndex);

            // Remove message elements from DOM starting from messageIndex
            const allMessages = chatWrapper.querySelectorAll('.message');
            for (let i = messageIndex; i < allMessages.length; i++) {
                allMessages[i].remove();
            }

            // Regenerate the assistant response
            await generateAssistantResponse();
        }

        function handleSlashCommand(command) {
            const parts = command.trim().split(/\s+/);
            const cmd = parts[0].toLowerCase();
            const arg = parts[1];

            if (cmd === '/temperature') {
                if (arg === undefined) {
                    addMessage('console', `Current temperature: ${currentTemperature}`);
                } else {
                    const temp = parseFloat(arg);
                    if (isNaN(temp) || temp < 0 || temp > 2) {
                        addMessage('console', 'Invalid temperature. Must be between 0.0 and 2.0');
                    } else {
                        currentTemperature = temp;
                        addMessage('console', `Temperature set to ${currentTemperature}`);
                    }
                }
                return true;
            } else if (cmd === '/topk') {
                if (arg === undefined) {
                    addMessage('console', `Current top-k: ${currentTopK}`);
                } else {
                    const topk = parseInt(arg);
                    if (isNaN(topk) || topk < 1 || topk > 200) {
                        addMessage('console', 'Invalid top-k. Must be between 1 and 200');
                    } else {
                        currentTopK = topk;
                        addMessage('console', `Top-k set to ${currentTopK}`);
                    }
                }
                return true;
            } else if (cmd === '/clear') {
                newConversation();
                return true;
            } else if (cmd === '/help') {
                addMessage('console',
                    'Available commands:\n' +
                    '/temperature - Show current temperature\n' +
                    '/temperature <value> - Set temperature (0.0-2.0)\n' +
                    '/topk - Show current top-k\n' +
                    '/topk <value> - Set top-k (1-200)\n' +
                    '/clear - Clear conversation\n' +
                    '/help - Show this help message'
                );
                return true;
            }
            return false;
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message || isGenerating) return;

            // Handle slash commands
            if (message.startsWith('/')) {
                chatInput.value = '';
                chatInput.style.height = 'auto';
                handleSlashCommand(message);
                return;
            }

            chatInput.value = '';
            chatInput.style.height = 'auto';

            const userMessageIndex = messages.length;
            messages.push({ role: 'user', content: message });
            addMessage('user', message, userMessageIndex);

            await generateAssistantResponse();
        }

        sendButton.disabled = false;

        // Autofocus the chat input on page load
        chatInput.focus();

        fetch(`${API_URL}/health`)
            .then(response => response.json())
            .then(data => {
                console.log('Engine status:', data);
            })
            .catch(error => {
                console.error('Engine not available:', error);
                chatWrapper.textContent = 'Engine not running. Please start engine.py first.';
            });

        // CellMem memory graph (D3 force-directed)
        // Inline tiny D3 force simulation (no external deps)
        const memGraph = {
            nodes: [],
            edges: [],
            sim: null,
            svg: null,
            g: null,
            width: 0,
            height: 0,
            selectedNode: null,
        };

        function surpriseToColor(surprise) {
            const t = Math.min(surprise / 12, 1);
            // dark-themed palette: deep blue -> cyan -> amber -> red
            if (t < 0.33) {
                const s = t * 3;
                return `rgb(${Math.round(40 + s * 20)}, ${Math.round(80 + s * 140)}, ${Math.round(200 + s * 55)})`;
            } else if (t < 0.66) {
                const s = (t - 0.33) * 3;
                return `rgb(${Math.round(60 + s * 185)}, ${Math.round(220 - s * 60)}, ${Math.round(255 - s * 200)})`;
            } else {
                const s = (t - 0.66) * 3;
                return `rgb(${Math.round(245 - s * 25)}, ${Math.round(160 - s * 120)}, ${Math.round(55 - s * 15)})`;
            }
        }

        function surpriseToRadius(surprise) {
            return 6 + Math.min(surprise / 8, 1) * 12;
        }

        function initMemoryGraph() {
            const container = document.getElementById('memoryGraphContainer');
            if (!container) return;
            const rect = container.getBoundingClientRect();
            memGraph.width = rect.width || 340;
            memGraph.height = rect.height || 400;

            // Create SVG
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', `0 0 ${memGraph.width} ${memGraph.height}`);
            svg.style.width = '100%';
            svg.style.height = '100%';

            // Defs for glow filter
            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
            filter.setAttribute('id', 'glow');
            const blur = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
            blur.setAttribute('stdDeviation', '3');
            blur.setAttribute('result', 'blur');
            const merge = document.createElementNS('http://www.w3.org/2000/svg', 'feMerge');
            const mn1 = document.createElementNS('http://www.w3.org/2000/svg', 'feMergeNode');
            mn1.setAttribute('in', 'blur');
            const mn2 = document.createElementNS('http://www.w3.org/2000/svg', 'feMergeNode');
            mn2.setAttribute('in', 'SourceGraphic');
            merge.appendChild(mn1);
            merge.appendChild(mn2);
            filter.appendChild(blur);
            filter.appendChild(merge);
            defs.appendChild(filter);
            svg.appendChild(defs);

            // Groups for edges and nodes (edges behind nodes)
            const edgeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            edgeGroup.setAttribute('id', 'memEdges');
            const nodeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            nodeGroup.setAttribute('id', 'memNodes');
            const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            labelGroup.setAttribute('id', 'memLabels');
            svg.appendChild(edgeGroup);
            svg.appendChild(nodeGroup);
            svg.appendChild(labelGroup);

            container.replaceChildren(svg);
            memGraph.svg = svg;
        }

        // Simple force simulation (no D3 dependency)
        function forceSimulate(nodes, edges, width, height) {
            const alpha = 0.3;
            const repulsion = 800;
            const linkDist = 60;
            const centerStrength = 0.05;
            const cx = width / 2, cy = height / 2;

            // Init positions if needed
            for (const n of nodes) {
                if (n.x === undefined) {
                    n.x = cx + (Math.random() - 0.5) * width * 0.6;
                    n.y = cy + (Math.random() - 0.5) * height * 0.6;
                }
                n.vx = 0; n.vy = 0;
            }

            // Run iterations
            for (let iter = 0; iter < 80; iter++) {
                const a = alpha * (1 - iter / 80);
                // Repulsion (charge)
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        let dx = nodes[j].x - nodes[i].x;
                        let dy = nodes[j].y - nodes[i].y;
                        let d2 = dx * dx + dy * dy;
                        if (d2 < 1) d2 = 1;
                        const f = repulsion / d2;
                        const fx = dx / Math.sqrt(d2) * f * a;
                        const fy = dy / Math.sqrt(d2) * f * a;
                        nodes[i].vx -= fx; nodes[i].vy -= fy;
                        nodes[j].vx += fx; nodes[j].vy += fy;
                    }
                }
                // Attraction (links)
                for (const e of edges) {
                    const s = nodes[e.source];
                    const t = nodes[e.target];
                    if (!s || !t) continue;
                    let dx = t.x - s.x;
                    let dy = t.y - s.y;
                    const d = Math.sqrt(dx * dx + dy * dy) || 1;
                    // Stronger attraction for higher similarity
                    const strength = 0.3 * e.similarity;
                    const f = (d - linkDist) * strength * a;
                    const fx = dx / d * f;
                    const fy = dy / d * f;
                    s.vx += fx; s.vy += fy;
                    t.vx -= fx; t.vy -= fy;
                }
                // Center gravity
                for (const n of nodes) {
                    n.vx += (cx - n.x) * centerStrength * a;
                    n.vy += (cy - n.y) * centerStrength * a;
                }
                // Apply velocity with damping
                for (const n of nodes) {
                    n.x += n.vx * 0.6;
                    n.y += n.vy * 0.6;
                    n.vx *= 0.4;
                    n.vy *= 0.4;
                    // Clamp to bounds
                    const pad = 20;
                    n.x = Math.max(pad, Math.min(width - pad, n.x));
                    n.y = Math.max(pad, Math.min(height - pad, n.y));
                }
            }
        }

        function renderMemoryGraph(data) {
            if (!memGraph.svg) initMemoryGraph();
            if (!memGraph.svg) return;

            const container = document.getElementById('memoryGraphContainer');
            const rect = container.getBoundingClientRect();
            memGraph.width = rect.width || 340;
            memGraph.height = rect.height || 400;
            memGraph.svg.setAttribute('viewBox', `0 0 ${memGraph.width} ${memGraph.height}`);

            const slots = data.slots || [];
            const edges = data.edges || [];

            // Build nodes — reuse positions from previous layout
            const oldPositions = {};
            for (const n of memGraph.nodes) oldPositions[n.id] = { x: n.x, y: n.y };
            const nodes = slots.map(s => ({
                id: s.slot,
                surprise: s.surprise,
                tokens: s.tokens || [],
                age: s.age,
                norm: s.norm,
                x: oldPositions[s.slot]?.x,
                y: oldPositions[s.slot]?.y,
            }));

            // Run simulation
            forceSimulate(nodes, edges, memGraph.width, memGraph.height);
            memGraph.nodes = nodes;
            memGraph.edges = edges;

            // Render edges
            const edgeGroup = memGraph.svg.querySelector('#memEdges');
            edgeGroup.replaceChildren();
            for (const e of edges) {
                const s = nodes.find(n => n.id === e.source);
                const t = nodes.find(n => n.id === e.target);
                if (!s || !t) continue;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', s.x);
                line.setAttribute('y1', s.y);
                line.setAttribute('x2', t.x);
                line.setAttribute('y2', t.y);
                const opacity = 0.1 + e.similarity * 0.5;
                line.setAttribute('stroke', `rgba(100, 160, 255, ${opacity})`);
                line.setAttribute('stroke-width', 0.5 + e.similarity * 2);
                edgeGroup.appendChild(line);
            }

            // Render nodes
            const nodeGroup = memGraph.svg.querySelector('#memNodes');
            nodeGroup.replaceChildren();
            const labelGroup = memGraph.svg.querySelector('#memLabels');
            labelGroup.replaceChildren();

            for (const n of nodes) {
                const r = surpriseToRadius(n.surprise);
                const color = surpriseToColor(n.surprise);

                // Outer glow circle
                const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                glow.setAttribute('cx', n.x);
                glow.setAttribute('cy', n.y);
                glow.setAttribute('r', r + 3);
                glow.setAttribute('fill', color);
                glow.setAttribute('opacity', '0.2');
                glow.setAttribute('filter', 'url(#glow)');
                nodeGroup.appendChild(glow);

                // Main circle
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', n.x);
                circle.setAttribute('cy', n.y);
                circle.setAttribute('r', r);
                circle.setAttribute('fill', color);
                circle.setAttribute('stroke', n.id === memGraph.selectedNode ? '#ffffff' : 'rgba(255,255,255,0.15)');
                circle.setAttribute('stroke-width', n.id === memGraph.selectedNode ? '2' : '1');
                circle.setAttribute('cursor', 'pointer');
                circle.addEventListener('mouseenter', () => showNodeDetail(n));
                circle.addEventListener('click', () => {
                    memGraph.selectedNode = n.id;
                    showNodeDetail(n);
                });
                nodeGroup.appendChild(circle);

                // Label (first token, truncated)
                if (n.tokens.length > 0 && r > 8) {
                    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    const txt = n.tokens[0].length > 8 ? n.tokens[0].slice(0, 7) + '…' : n.tokens[0];
                    label.setAttribute('x', n.x);
                    label.setAttribute('y', n.y + r + 12);
                    label.setAttribute('text-anchor', 'middle');
                    label.setAttribute('fill', '#9ca3af');
                    label.setAttribute('font-size', '9');
                    label.setAttribute('font-family', 'system-ui, sans-serif');
                    label.textContent = txt;
                    labelGroup.appendChild(label);
                }
            }
        }

        function showNodeDetail(node) {
            const detail = document.getElementById('memoryDetail');
            if (!detail) return;
            detail.replaceChildren();
            const title = document.createElement('div');
            title.className = 'detail-title';
            title.textContent = `Slot #${node.id}  ·  surprise: ${node.surprise}  ·  norm: ${node.norm}`;
            detail.appendChild(title);
            const tokens = document.createElement('div');
            tokens.className = 'detail-tokens';
            tokens.textContent = node.tokens.join('  ·  ');
            detail.appendChild(tokens);
        }

        async function refreshMemory() {
            try {
                const res = await fetch(`${API_URL}/memory`);
                const data = await res.json();
                const panel = document.getElementById('memoryPanel');
                const stats = document.getElementById('memoryStats');

                if (data.cellmem === 'disabled') {
                    panel.classList.remove('active');
                    return;
                }

                panel.classList.add('active');

                if (!data.slots) {
                    stats.textContent = data.memory_store || 'No memory yet';
                    return;
                }

                const mode = data.write_mode || 'raw';
                const edgeCount = (data.edges || []).length;
                stats.textContent = `${data.active_slots}/${data.total_slots} slots · ${edgeCount} edges · ${mode}`;

                renderMemoryGraph(data);
            } catch (e) {
                // silently ignore
            }
        }

        async function resetMemory() {
            try {
                await fetch(`${API_URL}/memory/reset`, { method: 'POST' });
                memGraph.nodes = [];
                memGraph.edges = [];
                memGraph.selectedNode = null;
                refreshMemory();
            } catch (e) { /* ignore */ }
        }

        // Initial check + poll after each message
        refreshMemory();
        const origGenerateAssistantResponse = generateAssistantResponse;
        generateAssistantResponse = async function() {
            await origGenerateAssistantResponse();
            refreshMemory();
        };
    </script>
</body>
</html>
