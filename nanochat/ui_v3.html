<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CellMem v3</title>
<style>
  :root { --bg: #1a1a2e; --surface: #16213e; --border: #0f3460; --accent: #e94560; --text: #eaeaea; --muted: #8b8fa3; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; }

  .chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header { padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 18px; color: var(--accent); font-weight: 700; }
  .header .subtitle { font-size: 13px; color: var(--muted); }
  .header .mem-toggle { margin-left: auto; font-size: 12px; color: var(--muted); cursor: pointer;
                        padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; user-select: none; }
  .header .mem-toggle:hover { color: var(--text); border-color: var(--accent); }

  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .msg.user { background: var(--border); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.bot { background: var(--surface); align-self: flex-start; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 13px; font-style: italic; background: none; }

  .input-bar { padding: 12px 20px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .input-bar input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
                     background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
  .input-bar input:focus { border-color: var(--accent); }
  .input-bar button { padding: 10px 20px; border-radius: 8px; border: none;
                      background: var(--accent); color: white; cursor: pointer; font-size: 14px; font-weight: 600; }
  .input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Memory panel */
  .mem-panel { width: 380px; background: #0d1117; border-left: 1px solid var(--border);
               display: none; flex-direction: column; overflow: hidden; }
  .mem-panel.active { display: flex; }
  .mem-panel-header { padding: 10px 14px; border-bottom: 1px solid var(--border);
                      display: flex; align-items: center; justify-content: space-between; }
  .mem-panel-header h3 { font-size: 13px; color: var(--text); font-weight: 600; }
  .mem-panel-header .clear-btn { font-size: 11px; padding: 3px 8px; border: 1px solid #2a2d3a;
                                  border-radius: 4px; background: #1a1d2e; color: var(--muted); cursor: pointer; }
  .mem-panel-header .clear-btn:hover { background: #2a2d3a; color: var(--text); }
  .mem-stats { font-size: 11px; color: var(--muted); padding: 6px 14px; border-bottom: 1px solid #161b22; }

  /* Graph area */
  .mem-graph { position: relative; height: 280px; border-bottom: 1px solid #161b22; overflow: hidden; }
  .mem-graph svg { width: 100%; height: 100%; }

  /* Detail on hover */
  .mem-detail { padding: 6px 14px; border-bottom: 1px solid #161b22; min-height: 40px;
                font-size: 11px; color: #9ca3af; background: #13151f; }
  .mem-detail .dt { color: var(--text); font-weight: 600; margin-bottom: 2px; }
  .mem-detail .dd { color: #60a5fa; }

  /* Text list */
  .mem-list { flex: 1; overflow-y: auto; padding: 8px; }
  .mem-item { padding: 6px 8px; margin-bottom: 4px; border-radius: 6px; background: #161b22;
              font-size: 12px; color: #c9d1d9; line-height: 1.4; word-break: break-word; cursor: pointer; }
  .mem-item:hover { background: #1c2333; }
  .mem-item .idx { color: var(--accent); font-weight: 600; margin-right: 4px; }
  .mem-item.highlighted { background: #1e3a5f; border: 1px solid #2563eb; }
</style>
</head>
<body>

<div class="chat-col">
  <div class="header">
    <h1>CellMem v3</h1>
    <span class="subtitle">automatic memory</span>
    <span class="mem-toggle" id="memToggle">memory</span>
  </div>
  <div class="messages" id="messages">
    <div class="msg system">Everything you say is automatically memorized. The model retrieves relevant memories to answer.</div>
  </div>
  <div class="input-bar">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<div class="mem-panel" id="memPanel">
  <div class="mem-panel-header">
    <h3>Memory</h3>
    <span class="clear-btn" id="clearBtn">clear</span>
  </div>
  <div class="mem-stats" id="memStats">loading...</div>
  <div class="mem-graph" id="memGraph"></div>
  <div class="mem-detail" id="memDetail">
    <div class="dt">Hover a node to see details</div>
  </div>
  <div class="mem-list" id="memList"></div>
</div>

<script>
const API = '';
let generating = false;

// ── Chat ──
document.getElementById('input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('memToggle').addEventListener('click', toggleMem);
document.getElementById('clearBtn').addEventListener('click', clearMem);

async function send() {
  if (generating) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  addMsg(text, 'user');
  const botEl = addMsg('', 'bot');
  generating = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    const res = await fetch(API + '/chat/completions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: [{role: 'user', content: text}], temperature: 0.7})
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.token) { botEl.textContent += data.token; botEl.scrollIntoView({block: 'end'}); }
        } catch(e) {}
      }
    }
  } catch(e) { botEl.textContent = 'Error: ' + e.message; }
  generating = false;
  document.getElementById('sendBtn').disabled = false;
  refreshAll();
}

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({block: 'end'});
  return div;
}

function toggleMem() {
  const panel = document.getElementById('memPanel');
  panel.classList.toggle('active');
  if (panel.classList.contains('active')) refreshAll();
}

async function clearMem() {
  await fetch(API + '/memory/reset', {method: 'POST'});
  addMsg('Memory cleared.', 'system');
  graphState.nodes = [];
  refreshAll();
}

// ── Memory Graph (force-directed, no deps) ──
const graphState = { nodes: [], selectedId: null };

function slotColor(idx, total) {
  const hue = (idx / Math.max(total, 1)) * 280 + 200; // blue → purple → pink
  return `hsl(${hue % 360}, 70%, 60%)`;
}

function initSvg() {
  const container = document.getElementById('memGraph');
  const rect = container.getBoundingClientRect();
  const w = rect.width || 380, h = rect.height || 280;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
  filter.setAttribute('id', 'glow');
  const blur = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
  blur.setAttribute('stdDeviation', '3'); blur.setAttribute('result', 'blur');
  const merge = document.createElementNS('http://www.w3.org/2000/svg', 'feMerge');
  const mn1 = document.createElementNS('http://www.w3.org/2000/svg', 'feMergeNode');
  mn1.setAttribute('in', 'blur');
  const mn2 = document.createElementNS('http://www.w3.org/2000/svg', 'feMergeNode');
  mn2.setAttribute('in', 'SourceGraphic');
  merge.appendChild(mn1); merge.appendChild(mn2);
  filter.appendChild(blur); filter.appendChild(merge);
  defs.appendChild(filter); svg.appendChild(defs);

  const edgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g'); edgeG.id = 'gEdges';
  const nodeG = document.createElementNS('http://www.w3.org/2000/svg', 'g'); nodeG.id = 'gNodes';
  const labelG = document.createElementNS('http://www.w3.org/2000/svg', 'g'); labelG.id = 'gLabels';
  svg.appendChild(edgeG); svg.appendChild(nodeG); svg.appendChild(labelG);

  container.replaceChildren(svg);
  return { svg, w, h };
}

function forceLayout(nodes, w, h) {
  const cx = w / 2, cy = h / 2;
  for (const n of nodes) {
    if (n.x === undefined) {
      n.x = cx + (Math.random() - 0.5) * w * 0.6;
      n.y = cy + (Math.random() - 0.5) * h * 0.6;
    }
    n.vx = 0; n.vy = 0;
  }
  for (let iter = 0; iter < 60; iter++) {
    const a = 0.3 * (1 - iter / 60);
    // Repulsion
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        let dx = nodes[j].x - nodes[i].x, dy = nodes[j].y - nodes[i].y;
        let d2 = dx * dx + dy * dy; if (d2 < 1) d2 = 1;
        const f = 600 / d2;
        const dd = Math.sqrt(d2);
        nodes[i].vx -= dx / dd * f * a; nodes[i].vy -= dy / dd * f * a;
        nodes[j].vx += dx / dd * f * a; nodes[j].vy += dy / dd * f * a;
      }
    }
    // Center gravity
    for (const n of nodes) {
      n.vx += (cx - n.x) * 0.05 * a;
      n.vy += (cy - n.y) * 0.05 * a;
    }
    // Apply
    for (const n of nodes) {
      n.x += n.vx * 0.6; n.y += n.vy * 0.6;
      n.vx *= 0.4; n.vy *= 0.4;
      n.x = Math.max(20, Math.min(w - 20, n.x));
      n.y = Math.max(20, Math.min(h - 20, n.y));
    }
  }
}

function renderGraph(slots) {
  const { svg, w, h } = initSvg();
  if (!slots || slots.length === 0) return;

  // Build nodes — reuse positions
  const oldPos = {};
  for (const n of graphState.nodes) oldPos[n.id] = { x: n.x, y: n.y };
  const nodes = slots.map((s, i) => ({
    id: s.slot, text: s.text || '',
    x: oldPos[s.slot] ? oldPos[s.slot].x : undefined,
    y: oldPos[s.slot] ? oldPos[s.slot].y : undefined,
    isUser: (s.text || '').startsWith('User said:'),
  }));

  forceLayout(nodes, w, h);
  graphState.nodes = nodes;

  const nodeG = svg.querySelector('#gNodes');
  const labelG = svg.querySelector('#gLabels');
  nodeG.replaceChildren();
  labelG.replaceChildren();

  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const r = 10;
    const color = n.isUser ? '#3b82f6' : '#8b5cf6';
    const selected = n.id === graphState.selectedId;

    // Glow
    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    glow.setAttribute('cx', n.x); glow.setAttribute('cy', n.y);
    glow.setAttribute('r', r + 3); glow.setAttribute('fill', color);
    glow.setAttribute('opacity', '0.2'); glow.setAttribute('filter', 'url(#glow)');
    nodeG.appendChild(glow);

    // Node
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y);
    circle.setAttribute('r', r); circle.setAttribute('fill', color);
    circle.setAttribute('stroke', selected ? '#fff' : 'rgba(255,255,255,0.15)');
    circle.setAttribute('stroke-width', selected ? '2' : '1');
    circle.setAttribute('cursor', 'pointer');
    circle.addEventListener('mouseenter', () => showDetail(n));
    circle.addEventListener('click', () => { graphState.selectedId = n.id; highlightItem(n.id); renderGraph(slots); });
    nodeG.appendChild(circle);

    // Label
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    const txt = n.text.replace(/^(User|Assistant) said:\s*/i, '');
    const short = txt.length > 12 ? txt.slice(0, 11) + '\u2026' : txt;
    label.setAttribute('x', n.x); label.setAttribute('y', n.y + r + 12);
    label.setAttribute('text-anchor', 'middle'); label.setAttribute('fill', '#9ca3af');
    label.setAttribute('font-size', '9'); label.textContent = short;
    labelG.appendChild(label);
  }
}

function showDetail(node) {
  const detail = document.getElementById('memDetail');
  detail.replaceChildren();
  const dt = document.createElement('div'); dt.className = 'dt';
  dt.textContent = 'Episode #' + node.id + (node.isUser ? ' (user)' : ' (assistant)');
  detail.appendChild(dt);
  const dd = document.createElement('div'); dd.className = 'dd';
  dd.textContent = node.text;
  detail.appendChild(dd);
}

function highlightItem(id) {
  document.querySelectorAll('.mem-item').forEach(el => {
    el.classList.toggle('highlighted', el.dataset.slot === String(id));
  });
}

// ── Refresh ──
async function refreshAll() {
  try {
    const res = await fetch(API + '/memory');
    const data = await res.json();
    document.getElementById('memStats').textContent =
      (data.active_episodes || 0) + ' episodes | ' + (data.active_slots || 0) + ' tokens';

    const slots = data.slots || [];

    // Graph
    renderGraph(slots);

    // List
    const list = document.getElementById('memList');
    while (list.firstChild) list.removeChild(list.firstChild);
    if (slots.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'mem-item'; empty.textContent = 'No memories yet';
      list.appendChild(empty);
    } else {
      for (const s of slots) {
        const item = document.createElement('div');
        item.className = 'mem-item';
        item.dataset.slot = String(s.slot);
        const idx = document.createElement('span');
        idx.className = 'idx'; idx.textContent = '[' + s.slot + ']';
        item.appendChild(idx);
        item.appendChild(document.createTextNode(' ' + (s.text || '')));
        item.addEventListener('click', () => { graphState.selectedId = s.slot; renderGraph(slots); highlightItem(s.slot); });
        list.appendChild(item);
      }
    }

    document.getElementById('memToggle').textContent = 'memory (' + (data.active_episodes || 0) + ')';
  } catch(e) {}
}

refreshAll();
setInterval(refreshAll, 15000);
</script>
</body>
</html>
